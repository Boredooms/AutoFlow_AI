[project]
name = "autoflow-ai"
version = "0.1.0"
description = "AutoFlow AI — intelligence and execution core (headless, API-first agentic task execution)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AutoFlow AI" }]

dependencies = [
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
]

[project.scripts]
autoflow = "autoflow_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoflow_ai"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "contract: schema/contract-level tests",
    "unit: unit tests",
]

[tool.coverage.run]
branch = true
source = ["autoflow_ai"]
